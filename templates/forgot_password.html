{% extends "base.html" %}

{% block title %}
Forgot Password
{% endblock %}


{% block content %}


<style>

body{

    background:
    linear-gradient(135deg,#09001f,#1e1036,#003b5c);

    font-family:'Poppins',sans-serif;

}



/* Main Card */


.password-card{

    max-width:520px;

    margin:auto;

    margin-top:70px;

    border:none;

    border-radius:35px;

    overflow:hidden;

    background:white;

    box-shadow:0 20px 50px rgba(0,0,0,.45);

}




/* Header */


.password-header{

    background:
    linear-gradient(135deg,#ff512f,#dd2476);

    color:white;

    padding:35px;

    text-align:center;

}



.password-header h2{

    font-weight:800;

}



.lock-icon{

    width:90px;

    height:90px;

    background:white;

    color:#dd2476;

    border-radius:50%;

    display:flex;

    justify-content:center;

    align-items:center;

    margin:auto;

    font-size:45px;

}



/* Body */


.password-body{

    padding:40px;

}



.form-control{

    border-radius:15px;

    padding:14px;

}



.form-control:focus{

    box-shadow:0 0 12px rgba(221,36,118,.4);

}



/* Button */


.reset-btn{

    background:
    linear-gradient(135deg,#ff512f,#dd2476);

    color:white;

    border:none;

    border-radius:30px;

    padding:14px;

    font-weight:bold;

    transition:.3s;

}



.reset-btn:hover{

    transform:translateY(-4px);

    color:white;

}




/* Security Info */


.security-box{

    background:#fff5f8;

    padding:15px;

    border-radius:15px;

    margin-top:25px;

    text-align:center;

    font-size:14px;

}



</style>




<div class="container">



<div class="card password-card">



<div class="password-header">


<div class="lock-icon">

🔐

</div>


<h2 class="mt-3">

Forgot Password?

</h2>


<p class="mb-0">

Reset your Study Quiz Hub account password

</p>


</div>





<div class="password-body">





<form method="POST">





<div class="mb-3">

<label class="fw-bold">

👤 Username

</label>


<input type="text"

name="username"

class="form-control"

placeholder="Enter username"

required>

</div>







<div class="mb-3">


<label class="fw-bold">

📧 Email

</label>


<input type="email"

name="email"

class="form-control"

placeholder="Enter registered email"

required>


</div>







<div class="mb-3">


<label class="fw-bold">

🔑 New Password

</label>


<input type="password"

name="new_password"

class="form-control"

placeholder="Create new password"

required>


</div>







<button type="submit"

class="btn reset-btn w-100">

🚀 Reset Password

</button>




</form>






<div class="security-box">


🛡️ Your account security is important.<br>

Create a strong password to protect your learning data.


</div>






<div class="text-center mt-4">


<a href="{{url_for('login')}}"

class="text-decoration-none fw-bold">

⬅ Back to Login

</a>


</div>





</div>


</div>


</div>


{% endblock %}
