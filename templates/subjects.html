{% extends "base.html" %}
{% block title %}Subjects - College Portal{% endblock %}
{% block content %}
<style>
.icon-circle{
    width:80px;
    height:80px;
    margin:auto;
    border-radius:50%;
    background:linear-gradient(135deg,#4f46e5,#06b6d4);
    display:flex;
    align-items:center;
    justify-content:center;
    color:white;
    font-size:35px;
    box-shadow:0 8px 20px rgba(0,0,0,.2);
    margin-bottom:15px;
}
.subject-card{
    background: linear-gradient(135deg,#4f46e5,#06b6d4);
    color:white;
    border:none;
    border-radius:20px;
    transition:0.3s;
}

.subject-card:hover{
    transform:translateY(-8px);
    box-shadow:0 15px 30px rgba(0,0,0,.25);
}
h2{
    text-align: center;
    color:#E5E7EB !important;
}
</style>
<body style="background-color: #1e1036;">
<h2 class="fw-bold mb-4">Subjects Overview</h2>
<div class="row">
{% for row in rows %}
<div class="col-md-3 mb-3">
    <div class="card subject-card shadow p-4 text-center">
    <div class="card shadow-sm text-center p-3">
        <div class="icon-circle">
        <i class="bi bi-layers-fill"></i>
        </div>
        <h2 class="fw-bold" style="color:#1e3a5f;"></h2>{{ row['student_count'] }}</h2>
        <p>{{ row['subject_name'] }}</p>
        <!-- Progress Bar -->
        <div class="progress" style="height:12px;">
            <div class="progress-bar bg-success progress-bar-striped progress-bar-animated"
                 role="progressbar"
                 style="width: {{ row['student_count'] }}%;"
                 aria-valuenow="{{ row['student_count'] }}"
                 aria-valuemin="0"
                 aria-valuemax="100">
            </div>
        </div>
    </div>
</div>
</div>
{% endfor %}
</div>



{% endblock %}
