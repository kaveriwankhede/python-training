{% extends "base.html" %}

{% block title %}
Add Question - Study Quiz Hub
{% endblock %}


{% block content %}


<style>

body{

    background:linear-gradient(135deg,#0f0c29,#302b63,#24243e);
    font-family:'Poppins',sans-serif;

}


/* Main Card */

.question-card{

    border:none;

    border-radius:30px;

    overflow:hidden;

    box-shadow:0 20px 50px rgba(0,0,0,.4);

}



/* Header */


.question-header{

    background:linear-gradient(135deg,#ff512f,#dd2476);

    color:white;

    padding:35px;

    text-align:center;

}


.question-header h2{

    font-weight:800;

}


.question-icon{

    font-size:55px;

}





/* Body */

.question-body{

    background:white;

    padding:40px;

}



/* Input */


.form-control{

    border-radius:15px;

    padding:13px;

    border:1px solid #ddd;

}


.form-control:focus{

    box-shadow:0 0 12px rgba(221,36,118,.4);

}





/* Labels */


.form-label{

    color:#333;

}





/* Option Box */


.option-box{

    background:#f8f9ff;

    padding:20px;

    border-radius:20px;

}





/* Button */


.add-btn{

    background:linear-gradient(135deg,#ff512f,#dd2476);

    border:none;

    color:white;

    border-radius:30px;

    padding:14px;

    font-weight:bold;

    transition:.3s;

}


.add-btn:hover{

    transform:translateY(-4px);

    color:white;

}



</style>




<div class="container py-5">


<div class="row justify-content-center">


<div class="col-lg-8">


<div class="card question-card">





<div class="question-header">


<div class="question-icon">

❓

</div>


<h2>

Add New Question

</h2>


<p class="mb-0">

Create quiz questions for students 🚀

</p>


</div>







<div class="question-body">





<form action="{{url_for('Add_Question')}}"
method="POST">






<!-- Subject -->


<div class="mb-4">


<label class="form-label fw-bold">

📚 Subject

</label>


<input type="text"

name="subject"

class="form-control"

placeholder="Enter subject name"

required>


</div>






<!-- Question -->


<div class="mb-4">


<label class="form-label fw-bold">

💬 Question

</label>


<input type="text"

name="question"

class="form-control"

placeholder="Enter quiz question"

required>


</div>








<!-- Options -->


<div class="option-box mb-4">


<label class="form-label fw-bold">

📝 Answer Options

</label>




<input type="text"

name="option1"

class="form-control mb-3"

placeholder="Option A"

required>





<input type="text"

name="option2"

class="form-control mb-3"

placeholder="Option B"

required>





<input type="text"

name="option3"

class="form-control mb-3"

placeholder="Option C"

required>





<input type="text"

name="option4"

class="form-control"

placeholder="Option D"

required>




</div>








<!-- Answer -->


<div class="mb-4">


<label class="form-label fw-bold">

✅ Correct Answer

</label>


<input type="text"

name="answer"

class="form-control"

placeholder="Enter correct answer"

required>


</div>









<div class="d-grid">


<button type="submit"

class="btn add-btn">


➕ Add Question


</button>


</div>






</form>





</div>


</div>


</div>


</div>


</div>



{% endblock %}
