<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Personalized Quiz | Study Quiz Hub</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

<style>

body{
    margin:0;
    font-family:'Segoe UI',sans-serif;
    background:linear-gradient(135deg,#0f172a,#312e81,#6d28d9);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:40px;
}

.quiz-card{

    max-width:1000px;
    width:100%;

    background:rgba(255,255,255,.08);

    backdrop-filter:blur(18px);

    border:1px solid rgba(255,255,255,.2);

    border-radius:25px;

    box-shadow:0 15px 40px rgba(0,0,0,.35);

    overflow:hidden;

}

.card-header{

    background:linear-gradient(90deg,#8b5cf6,#6366f1);

    color:white;

    padding:25px;

    text-align:center;

}

.card-header h2{

    margin:0;
    font-weight:bold;

}

.card-header p{

    margin-top:10px;
    opacity:.9;

}

.quiz-body{

    padding:30px;

}

.quiz-box{

    background:white;

    border-radius:15px;

    padding:25px;

    box-shadow:0 8px 25px rgba(0,0,0,.1);

}

pre{

    white-space:pre-wrap;

    word-wrap:break-word;

    font-size:17px;

    color:#222;

    font-family:Consolas,monospace;

    line-height:1.8;

}

.btn-custom{

    background:#8b5cf6;

    color:white;

    border:none;

    padding:12px 30px;

    border-radius:30px;

    transition:.3s;

}

.btn-custom:hover{

    background:#6d28d9;

    color:white;

}

.footer{

    text-align:center;

    color:white;

    margin-top:20px;

    opacity:.8;

}

.icon{

    font-size:45px;

    margin-bottom:10px;

}

</style>

</head>

<body>

<div class="quiz-card">

<div class="card-header">

<div class="icon">
<i class="fa-solid fa-brain"></i>
</div>

<h2>AI Personalized Quiz</h2>

<p>
Personalized questions generated according to your previous quiz performance.
Improve your weak topics and become an expert.
</p>

</div>

<div class="quiz-body">

<div class="quiz-box">

<pre>{{ quiz }}</pre>

</div>

<div class="text-center mt-4">

<a href="/student_dashboard" class="btn btn-custom me-2">
<i class="fa-solid fa-house"></i>
 Dashboard
</a>

<a href="/explore_technology" class="btn btn-success">
<i class="fa-solid fa-play"></i>
 Start New Quiz
</a>

</div>

</div>

</div>

</body>

</html>
