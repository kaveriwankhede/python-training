{% extends "base.html" %}

{% block title %}AI Website Guide{% endblock %}

{% block content %}
<body style="background-color: #1e1036;">
<style>

body{
    
    font-family:'Poppins',sans-serif;
}

.guide-card{

    max-width:950px;
    margin:40px auto;
    background:white;
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 10px 35px rgba(0,0,0,.15);

}

.header{

    background:linear-gradient(135deg,#2563eb,#7c3aed);
    color:white;
    text-align:center;
    padding:40px;

}

.header h1{

    font-weight:bold;

}

.content{

    padding:35px;

}

.ai-box{

    background:#f8f9fa;
    border-left:6px solid #2563eb;
    border-radius:12px;
    padding:25px;
    white-space:pre-wrap;
    line-height:1.8;
    font-size:17px;

}

.footer{

    text-align:center;
    padding:25px;

}

.btn-home{

    border-radius:30px;
    padding:12px 35px;

}

</style>

<div class="container">

<div class="guide-card">

<div class="header">

<h1>🤖 AI Website Guide</h1>

<p class="mt-3">

Welcome to <b>Study Quiz Hub</b>

</p>

</div>

<div class="content">

<h4 class="mb-4">

📖 AI Assistant Response

</h4>

<div class="ai-box">

{{ guide }}

</div>

</div>

<div class="footer">

<a href="{{ url_for('Home') }}"
class="btn btn-primary btn-home">

🏠 Back to Home

</a>

</div>

</div>

</div>

{% endblock %}
