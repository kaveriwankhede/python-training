<!DOCTYPE html>
<html>
    <head>
        <title> AI study tips</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    </head>
    <body class="bg-light">
        <div class="container mt-5">
            <div class="row justify-content-center">
                <div class="col-md-8">
                    <div class="card shadow-sm">
                        <div class="card-body">
                            <h4 class="fw-bold mb-3">AI study Tips</h4>
                            <form method="POST" action="/get_tip">
                                <input type="text" name="name" class="form-control mb-2" placeholder="Enter your name">
                                <input type="text" name="marks" class="form-control mb-2" placeholder="Enter your marks">
                                <input type="text" name="subject" class="form-control mb-2" placeholder="Enter your subjects">
                                <button type="submit" class="btn btn-primary">Get AI Tips</button>
                            </form>

                        </div>
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
